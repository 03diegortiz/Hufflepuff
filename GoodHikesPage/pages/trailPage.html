<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Good Hike Trails | Nisqually Vista Trail</title>
        <link rel="stylesheet" href="trailPage.css">
    </head>
    <body>
        <header>
            <h2>&#9650; Good Hike Trails</h2>
            <nav class="vertical">
                <ul>
                <li><a href="GoodHike_Trails.html">Home</a></li>
                <li><a href="pages/favorite-trails.html">Favorite Trails</a></li>
                </ul>
            </nav> 
        </header>


        <main>
            <section class="trail-images">
                <figure>
                    <img id="hikeImage" src="" alt="Trail photograph">
                </figure>

                <figure>
                    <img id="hikeMap" src="" alt="Trail map">
                </figure>
            </section>
            

            <section id="trail-name">
                <h1 id="hikeName"></h1>
            </section>
                
            <div id="hikeMain">
                <section class="hikeInfo">
                    <h2>General Information:</h2>

                    <ul>
                        <li id="difficultyColor"><strong>Difficulty:</strong> <span id="Difficulty"></span></li>
                        <li><strong>Location:</strong> <span id="Location"></span></li>
                        <li><strong>Trail Type:</strong> <span id="TrailType"></span></li>
                        <li><strong>Distance:</strong> <span id="Distance"></span></li>
                        <li><strong>Estimated Time:</strong> <span id="EstTime"></span></li>
                        <li><strong>Elevation Gain:</strong> <span id="Elevation"></span></li>
                        <li><strong>Parking:</strong> <span id="Parking"></span></li>
                        <li><strong>Entrance Fee:</strong> <span id="Fee"></span></li>
                        <li><strong>Pets:</strong> <span id="Pets"></span></li>
                        <li><strong>Scenery:</strong> <span id="Scenery"></span></li>
                    </ul>

                </section>

                <section class="notes">
                    <h2>Notes</h2>

                    <textarea id="hikeNotes" name="hikeNotes" rows="8" cols="40" placeholder="Write your hiking notes here"></textarea>
                <div class="notes-buttons">
                    <button type="button" id="addNotes">Add Notes</button>
                    <button type="button" id="favorites">Add to Favorites</button>

                </div>
                    
                </section>
            </div>
        </main>

        <footer>
         Good Hike Trails &copy; 2026 All Rights Reserved
        </footer>

        <script src="scripts/hikes.js"></script>
        <script src="scripts/trailPage.js"></script>
    </body>
</html>
